<!DOCTYPE html>
<html lang="th">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Online Notepad</title>

  <!-- =========================================================
       NOTEPAD CSS
  ========================================================== -->
  <link
    rel="stylesheet"
    href="css/notepad.css"
  >

</head>


<body>

  <main class="notepad-page">

    <!-- =======================================================
         HEADER
    ======================================================== -->

    <header class="notepad-header">

      <div class="notepad-title">

        <!-- BACK TO HOME -->

        <button
          type="button"
          class="notepad-home-btn"
          id="btn-back-home"

          data-i18n-title="notepad.backHome"
          data-i18n-aria-label="notepad.backHome"
        >

          <span
            class="notepad-home-arrow"
            aria-hidden="true"
          >
            ←
          </span>

          <span
            data-i18n="common.home"
          >
            หน้าหลัก
          </span>

        </button>


        <!-- NOTE ICON -->

        <div
          class="notepad-icon"
          aria-hidden="true"
        >
          📝
        </div>


        <!-- TITLE -->

        <div>

          <h1
            data-i18n="notepad.title"
          >
            Online Notepad
          </h1>


          <p
            data-i18n="notepad.subtitle"
          >
            จดข้อความของคุณได้ง่าย ๆ และบันทึกอัตโนมัติ
          </p>

        </div>

      </div>


      <!-- SAVE STATUS -->

      <div
        class="notepad-status"
        aria-live="polite"
      >

        <span
          class="status-dot"
          aria-hidden="true"
        ></span>


        <span
          id="notepad-save-status"
          data-i18n="common.ready"
        >
          พร้อมใช้งาน
        </span>

      </div>

    </header>


    <!-- =======================================================
         TOOLBAR
    ======================================================== -->

    <section
      class="notepad-toolbar"
      aria-label="Notepad toolbar"
      data-i18n-aria-label="notepad.toolbar"
    >

      <!-- MAIN ACTIONS -->

      <div class="toolbar-group">

        <!-- NEW -->

        <button
          type="button"
          class="notepad-btn"
          id="btn-new-note"
          data-i18n-title="notepad.newNote"
        >

          <span aria-hidden="true">
            📄
          </span>

          <span
            data-i18n="notepad.new"
          >
            ใหม่
          </span>

        </button>


        <!-- COPY -->

        <button
          type="button"
          class="notepad-btn"
          id="btn-copy-note"
          data-i18n-title="notepad.copyAll"
        >

          <span aria-hidden="true">
            📋
          </span>

          <span
            data-i18n="notepad.copy"
          >
            คัดลอก
          </span>

        </button>


        <!-- SAVE TXT -->

        <button
          type="button"
          class="notepad-btn"
          id="btn-save-txt"
          data-i18n-title="notepad.saveTxt"
        >

          <span aria-hidden="true">
            💾
          </span>

          <span>
            <span
              data-i18n="notepad.save"
            >
              บันทึก
            </span>
            .TXT
          </span>

        </button>


        <!-- CLEAR -->

        <button
          type="button"
          class="notepad-btn"
          id="btn-clear-note"
          data-i18n-title="notepad.clear"
        >

          <span aria-hidden="true">
            🗑️
          </span>

          <span
            data-i18n="common.clear"
          >
            ล้างทั้งหมด
          </span>

        </button>

      </div>


      <!-- DIVIDER -->

      <div
        class="toolbar-divider"
        aria-hidden="true"
      ></div>


      <!-- UNDO / REDO -->

      <div class="toolbar-group">

        <!-- UNDO -->

        <button
          type="button"
          class="notepad-btn icon-only"
          id="btn-undo"

          data-i18n-title="notepad.undo"
          data-i18n-aria-label="notepad.undoLabel"
        >
          ↶
        </button>


        <!-- REDO -->

        <button
          type="button"
          class="notepad-btn icon-only"
          id="btn-redo"

          data-i18n-title="notepad.redo"
          data-i18n-aria-label="notepad.redoLabel"
        >
          ↷
        </button>

      </div>


      <!-- DIVIDER -->

      <div
        class="toolbar-divider"
        aria-hidden="true"
      ></div>


      <!-- SEARCH -->

      <div
        class="toolbar-group toolbar-search"
      >

        <div class="search-box">

          <span
            class="search-icon"
            aria-hidden="true"
          >
            🔍
          </span>


          <input
            type="search"
            id="notepad-search"

            data-i18n-placeholder="notepad.searchPlaceholder"
            data-i18n-aria-label="notepad.searchLabel"

            placeholder="ค้นหา..."
            autocomplete="off"
            spellcheck="false"
          >


          <button
            type="button"
            id="btn-search-clear"
            class="search-clear"

            data-i18n-title="notepad.clearSearch"
            data-i18n-aria-label="notepad.clearSearch"
          >
            ×
          </button>

        </div>

      </div>

    </section>


    <!-- =======================================================
         EDITOR
    ======================================================== -->

    <section
      class="notepad-editor-wrapper"
      data-i18n-aria-label="notepad.editorSection"
    >

      <div class="notepad-editor">

        <textarea
          id="notepad-textarea"
          class="notepad-textarea"

          data-i18n-placeholder="notepad.editorPlaceholder"
          data-i18n-aria-label="notepad.editorLabel"

          placeholder="เริ่มพิมพ์ข้อความของคุณที่นี่..."
          spellcheck="false"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
        ></textarea>

      </div>

    </section>


    <!-- =======================================================
         FOOTER / INFORMATION
    ======================================================== -->

    <footer class="notepad-footer">

      <!-- COUNTERS -->

      <div class="notepad-info">

        <span>

          <span
            data-i18n="notepad.characters"
          >
            ตัวอักษร
          </span>

          :

          <strong id="notepad-character-count">
            0
          </strong>

        </span>


        <span
          class="info-divider"
          aria-hidden="true"
        >
          •
        </span>


        <span>

          <span
            data-i18n="notepad.words"
          >
            คำ
          </span>

          :

          <strong id="notepad-word-count">
            0
          </strong>

        </span>


        <span
          class="info-divider"
          aria-hidden="true"
        >
          •
        </span>


        <span>

          <span
            data-i18n="notepad.lines"
          >
            บรรทัด
          </span>

          :

          <strong id="notepad-line-count">
            0
          </strong>

        </span>

      </div>


      <!-- SHORTCUTS -->

      <div class="notepad-shortcuts">

        <span>

          <kbd>
            Ctrl
          </kbd>

          <kbd>
            Z
          </kbd>

          <span
            data-i18n="notepad.undo"
          >
            ย้อนกลับ
          </span>

        </span>


        <span>

          <kbd>
            Ctrl
          </kbd>

          <kbd>
            Y
          </kbd>

          <span
            data-i18n="notepad.redo"
          >
            ทำซ้ำ
          </span>

        </span>

      </div>

    </footer>

  </main>


  <!-- =========================================================
       NEW NOTE CONFIRMATION
  ========================================================== -->

  <div
    class="notepad-modal"
    id="notepad-confirm-modal"
    hidden
  >

    <!-- BACKDROP -->

    <div
      class="notepad-modal-backdrop"
    ></div>


    <!-- MODAL -->

    <div
      class="notepad-modal-box"
      role="dialog"
      aria-modal="true"
      aria-labelledby="notepad-confirm-title"
    >

      <div
        class="modal-icon"
        aria-hidden="true"
      >
        ⚠️
      </div>


      <h2
        id="notepad-confirm-title"
        data-i18n="notepad.newNoteQuestion"
      >
        สร้างโน้ตใหม่?
      </h2>


      <p
        data-i18n="notepad.currentTextWillClear"
      >
        ข้อความปัจจุบันจะถูกล้างออก
      </p>


      <div class="modal-actions">

        <button
          type="button"
          class="modal-btn modal-btn-cancel"
          id="btn-modal-cancel"

          data-i18n="common.cancel"
        >
          ยกเลิก
        </button>


        <button
          type="button"
          class="modal-btn modal-btn-confirm"
          id="btn-modal-confirm"

          data-i18n="notepad.createNew"
        >
          สร้างใหม่
        </button>

      </div>

    </div>

  </div>


  <!-- =========================================================
       I18N
  ========================================================== -->

  <script src="js/i18n.js"></script>


  <!-- =========================================================
       NOTEPAD JAVASCRIPT
  ========================================================== -->

  <script src="js/notepad.js"></script>


  <!-- =========================================================
       BACK TO HOME
  ========================================================== -->

  <script>

    (() => {

      'use strict';


      const backHomeBtn =
        document.getElementById(
          'btn-back-home'
        );


      if (!backHomeBtn) {
        return;
      }


      backHomeBtn.addEventListener(
        'click',
        () => {

          window.location.href =
            'index.html';

        }
      );

    })();

  </script>

</body>
</html>
